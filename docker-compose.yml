version: '3.8'

services:
  openclaw-console:
    build: .
    container_name: openclaw-agent-console
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - OPENCLAW_PASSWORD=openclaw2025
      - DATA_FILE_PATH=/app/data/openclaw_store.json
      # Optional Direct Providers (Uncomment if bypassing Kaggle polling):
      # - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # - OPENAI_COMPATIBLE_URL=https://api.openai.com/v1
      # - OPENAI_API_KEY=sk-your-key-here
      # - AGENT_WEBHOOK_URL=https://your-agent-webhook.com
    volumes:
      - openclaw-data:/app/data

volumes:
  openclaw-data:
